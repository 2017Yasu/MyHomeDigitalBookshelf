name: test-solution
run-name: Test Solution
on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db_test:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test
          POSTGRES_DB: my_home_bookshelves
        ports:
          - 35432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Initialize DB
        run: |
          dotnet run \
            --project ./MyHomeDigitalBookshelf/DbMigrator/MyHomeDigitalBookshelf.DbMigrator.csproj \
            -- \
            --host localhost \
            --port 35432 \
            --database my_home_bookshelves \
            --user test_user \
            --password test \
            --dir sql/up

      - name: Install dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --no-restore --configuration Release

      - name: Run tests
        run: dotnet test --verbosity normal --no-build --configuration Release
