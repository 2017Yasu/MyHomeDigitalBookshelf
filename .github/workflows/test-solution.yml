name: test-solution
run-name: Test Solution
on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db_test:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test
          POSTGRES_DB: my_home_bookshelves
        ports:
          - 35432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Install PostgreSQL Client
        run: sudo apt update && sudo apt install -y postgresql-client

      - name: Initialize database
        run: |
          for file in $(ls ./sql/up); do
            echo "Executing $file"
            psql -h localhost -p 35432 -U test_user -d my_home_bookshelves -f ./sql/up/$file
          done

      - name: Install dependencies
        run: dotnet restore

      - name: Run tests
        run: dotnet test MyHomeDigitalBookshelf/Infrastructure.Tests
